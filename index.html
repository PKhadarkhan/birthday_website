<!DOCTYPE html>
<html>
  <head>
    <title>Redirecting...</title>
    <script>
      var currentUrl = window.location.href;
      if (!currentUrl.endsWith('/') && !currentUrl.endsWith('.html')) {
        currentUrl += '/';
      }
      window.location.href = currentUrl + "html/index.html";
    </script>
  </head>
  <body>
    <p>Redirecting to the birthday site...</p>
  </body>
</html>
