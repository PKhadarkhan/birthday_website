<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .full-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <!-- Birthday Video with Autoplay and Controls -->
    <video id="birthdayVideo" autoplay playsinline controls class="full-video">
        <source src="../videos/video2.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <script>
        // Redirect to the surprise page when the video finishes playing
        document.getElementById('birthdayVideo').addEventListener('ended', function() {
            window.location.href = "surprise.html";
        });
    </script>
</body>

</html>
