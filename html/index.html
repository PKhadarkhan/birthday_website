<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@600&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="countdown-wrapper d-flex flex-column align-items-center min-vh-100 position-relative">

        <h1 class="birthday-title text-center mb-5">Happy Birthday<br>to the Fahima!</h1>

        <div class="glass-card mt-3">
            <div id="countdown" class="d-flex justify-content-center align-items-center">
                <div class="time-block">
                    <span id="hours">00</span>
                </div>
                <span class="separator">:</span>
                <div class="time-block">
                    <span id="minutes">00</span>
                </div>
                <span class="separator">:</span>
                <div class="time-block">
                    <span id="seconds">00</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="../js/script.js"></script>
</body>

</html>
